name: Validate GenLayer Contract

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GenLayer tools
        run: |
          python -m pip install --upgrade pip
          pip install genvm-linter

      - name: Lint contract
        run: |
          genvm-lint lint ai_task_verifier.py
